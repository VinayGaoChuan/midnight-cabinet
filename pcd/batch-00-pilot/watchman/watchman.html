 *                  → 命中（假人被琥珀单色剪影罩住定格 0.4 秒 + 头顶 3 颗转星 → 才闪白 + 大摇 + 击退 1 格 + 震屏 1 格）→ 收招（灯 2→1→0，余烬飘升）
 *   场外「照夜」（按 7）：压暗 → 闪暖白 → 横向探照光带向右扫过 → 被照到的敌人琥珀剪影定格 2.5 秒，头顶挂小灯 + 三颗转星

 *
 * 结构：1 色板 · 2 引擎（勿改）· 3 角色（换人改这里）· 4 特效（换人改这里）· 5 舞台 · 6 循环（勿改）
 */
(() => {
'use strict';
// ═════════════════════════ 1. 色板：屏幕上每个像素都来自这里 ═════════════════════════
const PAL = [
  '#0b0a18', '#12132e', '#1a1d45', '#242b5f', '#333d7c', //  0 墨 · 1–4 夜空
  '#fff3d4', '#cdc5a3', '#8d8670',                       //  5–7 月光 / 暖灰
  '#221f33', '#37324b', '#524b6a',                       //  8–10 石
  '#33102a', '#621c40', '#9c2f4c',                       // 11–13 袍（勾线 / 暗 / 基）
  '#e3a13c', '#f2c7a0', '#b27658',                       // 14 金 · 15–16 肤
  '#ebe9e1', '#a6a2b5', '#7a4a2b', '#472916',            // 17–18 胡 · 19–20 木
  '#ffffff', '#86f5ff', '#38b2ff', '#7b5cff', '#33218a', // 21–25 魔法 白→青→蓝→紫→深紫
  '#cf4f5a',                                             // 26 袍亮
  '#0e130b', '#1f2a16', '#36472a', '#56693b',            // 27–30 守夜人 · 夜巡斗篷 墨橄榄绿（勾线 / 暗 / 基 / 亮）

  '#8a5a1e',                                             // 35 守夜人 · 暗铜（黄铜镶边暗部，亮部借 14 金）
  '#fff2a0', '#ffcf4a', '#c8701e', '#4a2410',            // 36–39 守夜人 · 照夜琥珀灯火：烛黄 → 琥珀 → 焦橙 → 暗褐

// 天空闪白只提亮夜空 1–4（FLASH 其余保持原色，角色身上的颜色不会跟着变）

const FXR = [[21, 22, 23, 24, 25], [21, 5, 14, 19, 20], [21, 26, 13, 12, 11], [6, 7, 10, 9, 8], [22, 23, 24, 25, 3], [21, 36, 37, 38, 39]];
const R_MAGIC = 0, R_IMPACT = 1, R_ENEMY = 2, R_DUST = 3, R_SOUL = 4, R_AMBER = 5;   // R_AMBER：守夜人「照夜」琥珀灯火

// ═════════════════════════ 2. 引擎：材质缓冲 → 分部明暗 → 分界线 → 选择性勾线 → 轮廓光 → 闪白 → 消散 ═════════════════════════
// 材质 = [勾线, 暗, 基, 亮] 四个色板下标；band = 暗边宽度；flat = 不自动明暗（眼、宝石、发光体）
const MRAMP = [0, 0, 0, 0], MBAND = [0], MFLAT = [0];
function defMat(r, band, flat) { MRAMP.push(r[0], r[1], r[2], r[3]); MBAND.push(band || 1); MFLAT.push(flat ? 1 : 0); return MBAND.length - 1; }

function part() { cPart++; }  // 之后画的是新部件，位于之前所有部件前面
function sp(x, y, m, t) {
  x = Math.round(x); y = Math.round(y); if (shear) x += Math.round(shear * -y / 26);
  x += dX + S.ox; y += dY + S.oy; if (x < 0 || y < 0 || x >= S.w || y >= S.h) return; const i = y * S.w + x;
  if (!m) { S.mat[i] = 0; return; } S.mat[i] = m; S.tone[i] = t || 0; S.part[i] = cPart;
}
function run(y, x0, x1, m, t) { x0 = Math.round(x0); x1 = Math.round(x1); for (let x = x0; x <= x1; x++) sp(x, y, m, t); }
function rect(x, y, w, h, m, t) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) sp(x + i, y + j, m, t); }
function line(x0, y0, x1, y1, m, t, maxY) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const ax = Math.abs(x1 - x0), ay = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = ax + ay;
  for (let n = 0; n < 200; n++) { if (y0 <= maxY) sp(x0, y0, m, t); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= ay) { e += ay; x0 += sx; } if (e2 <= ax) { e += ax; y0 += sy; } }
}

// ═════════════════════════ 3. 角色：守夜人（换角色时改这一节） ═════════════════════════

const P = { hx: 0, hy: 0, a: 0, lean: 0, head: 0, crouch: 0, bob: 0, hmode: 0, sx: 0, sy: 0, sway: 0, bend: 0, beard: 0, gem: 0, glint: 0, door: 0, rim: 0, gx: 0, gy: 0, bx: 0, eyes: 0, flash: 0, step: 0, wup: 0, walk: 0, lying: 0, lift: 0, hatX: 0, hatY: 0, hatR: 0, halB: 0, dq: 0, ddir: 0, flip: 0, mx: 0, k1: 0, k2: 0 };
const HALF = Math.PI / 2;
// 关键帧：后手（握戟）位置 hx/hy、戟角 a、前倾、头、下蹲、灯盾偏移 sx/sy
const K_IDLE = { hx: -9, hy: -16, a: 0, lean: 0, head: 0, crouch: 0, sx: 0, sy: 0 };

// ───── 动作表：每个状态按 12 fps 取样逐帧排开，用来审核姿势与细节 ─────
const SHEET = [[IDLE, [0, 0.4, 0.8, 1.2, 1.7, 1.85]], [MOVE, [0, 1 / 6, 2 / 6, 3 / 6]], [ATTACK, null], [CHARGE, 'step2'], [CAST, null], [RECOVER, 'step2'], [HURT, 'hurt'], [DEATH, [0.34, 0.42, 0.6, 0.7, 0.9, 1.1, 1.3, 1.95, 2.15, 2.35]], [REVIVE, [0.45, 0.55, 0.65, 0.75, 0.9]]];
function buildSheet() {
  const box = document.getElementById('sheet'); box.textContent = '';
  const fr = new Uint8ClampedArray(hero.w * hero.h * 4), tmp = new ImageData(fr, hero.w, hero.h);
  for (const [st, spec] of SHEET) {
    let ts = []; if (Array.isArray(spec)) ts = spec; else { const step = spec === 'step2' ? 2 / 12 : 1 / 12, t0 = spec === 'hurt' ? INCOMING : 0; for (let t = t0; t < DUR[st] - 1e-6; t += step) ts.push(t); }
    const h = document.createElement('h2'); h.textContent = NAMES[st] + ' · ' + ts.length + ' 帧 · ' + DUR[st].toFixed(2) + ' 秒'; box.appendChild(h);
    const row = document.createElement('div'); row.className = 'frames'; box.appendChild(row);
    for (const t of ts) {
      poseAt(st, t, t); drawHero(); bakeHero();
      for (let i = 0; i < hero.w * hero.h; i++) { const c = hero.out[i]; const v = LUT[c === 255 ? (Math.floor(i / hero.w) === hero.oy + 1 ? 10 : 2) : c]; fr[i * 4] = v & 255; fr[i * 4 + 1] = (v >> 8) & 255; fr[i * 4 + 2] = (v >> 16) & 255; fr[i * 4 + 3] = 255; }
      const cv = document.createElement('canvas'); cv.width = hero.w; cv.height = hero.h; cv.style.width = hero.w * 3 + 'px'; cv.style.height = hero.h * 3 + 'px'; cv.title = t.toFixed(2) + 's'; cv.getContext('2d').putImageData(tmp, 0, 0); row.appendChild(cv);
    }
  }
  hero.k1 = hero.k2 = -1; poseAt(state, stT, simT);
}
function toggleSheet(on) { const box = document.getElementById('sheet'); const show = on == null ? box.hidden : on; if (show) buildSheet(); box.hidden = !show; }

// ───── 输入与状态显示 ─────
const stateEl = document.getElementById('state');
let acc = 0, last = performance.now(), paused = false, slow = false, lastLabel = '';
function play(s) { auto = false; if (s === IDLE || s === MOVE || s === ATTACK || s === CHARGE || s === HURT || s === DEATH) enter(s); }
addEventListener('keydown', (e) => {
  const k = e.code;
  if (k === 'Space') { e.preventDefault(); paused = !paused; }
  else if (k === 'ArrowRight' && paused) { for (let i = 0; i < 5; i++) update(); }
  else if (k === 'KeyS') slow = !slow;
  else if (k === 'KeyA') { auto = !auto; if (auto) { reelI = 0; enter(REEL[0]); } }
  else if (k === 'KeyT') toggleSheet();
  else if (k === 'Digit1') play(IDLE); else if (k === 'Digit2') play(MOVE); else if (k === 'Digit3') play(ATTACK); else if (k === 'Digit4') play(CHARGE); else if (k === 'Digit5') play(HURT); else if (k === 'Digit6') play(DEATH);
});
disp.addEventListener('click', () => { paused = !paused; });
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > 0.25) dt = 0.25;
  if (!paused) { acc += slow ? dt * 0.25 : dt; let n = 0; while (acc >= DT && n < 8) { update(); acc -= DT; n++; } if (n === 8) acc = 0; }
  render();
  const label = NAMES[state] + (paused ? ' · 暂停' : slow ? ' · 慢放' : '') + (auto ? '' : ' · 手动');
  if (label !== lastLabel) { stateEl.textContent = label; lastLabel = label; }
  requestAnimationFrame(frame);
}
// ───── 验收接口：自动检查、色板检查、数据导出（scripts/shoot.mjs、以后的 HD-2D 与游戏替换都用它） ─────
const AUDIT = [[IDLE, 2], [MOVE, 4], [ATTACK, 4], [CHARGE, 3], [CAST, 2], [RECOVER, 2], [HURT, 3], [DEATH, 6]];
const GLOW_SET = new Uint8Array(MBAND.length + 4); for (const m of GLOW_MATS) GLOW_SET[m] = 1;
function frameHash(o) { let h = 2166136261; for (let i = 0; i < o.length; i++) { h ^= o[i]; h = Math.imul(h, 16777619); } return h >>> 0; }
function bboxOf(o) { let x0 = 999, y0 = 999, x1 = -1, y1 = -1, n = 0, edge = false, bad = 0; for (let y = 0; y < hero.h; y++) for (let x = 0; x < hero.w; x++) { const c = o[y * hero.w + x]; if (c === 255) continue; n++; if (c >= PAL.length) bad++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; if (x === 0 || y === 0 || x === hero.w - 1 || y === hero.h - 1) edge = true; } return { x0, y0, x1, y1, n, edge, bad }; }
function audit() {
  const res = { name: document.title, states: {}, problems: [] };
  for (const [st, min] of AUDIT) {
    const seen = new Set(); let edge = false, bad = 0, X0 = 999, Y0 = 999, X1 = -1, Y1 = -1;
    for (let t = 0; t < DUR[st] - 1e-6; t += 1 / 12) { poseAt(st, t, t); drawHero(); bakeHero(); seen.add(frameHash(hero.out)); const b = bboxOf(hero.out); edge = edge || b.edge; bad += b.bad; if (b.n) { X0 = Math.min(X0, b.x0); Y0 = Math.min(Y0, b.y0); X1 = Math.max(X1, b.x1); Y1 = Math.max(Y1, b.y1); } }
    res.states[NAMES[st]] = { distinctFrames: seen.size, bbox: [X0 - hero.ox, Y0 - hero.oy, X1 - hero.ox, Y1 - hero.oy], clipped: edge };
    if (seen.size < min) res.problems.push(NAMES[st] + '：只有 ' + seen.size + ' 个不同帧（至少 ' + min + '）');
    if (edge) res.problems.push(NAMES[st] + '：画到了缓冲边缘，会被裁掉（加大 Sprite 尺寸）');

function paletteCheck() { const ok = new Set(); for (let i = 0; i < LUT.length; i++) { ok.add(LUT[i]); ok.add(LUTF[i]); } let bad = 0; for (let i = 0; i < px32.length; i++) if (!ok.has(px32[i])) bad++; return bad; }

// 导出：每个状态按 12 fps 的逐帧色板下标、发光遮罩、发光体位置；外加尺寸、脚底锚点、受击点、色板
function exportData() {
  const out = { name: document.title, palette: PAL, w: hero.w, h: hero.h, ox: hero.ox, oy: hero.oy, hitPoint: HIT_POINT, states: {} }, glow = new Uint8Array(hero.w * hero.h);
  for (const [st] of AUDIT.concat([[REVIVE, 0]])) {
    const frames = [];
    for (let t = 0; t < DUR[st] - 1e-6; t += 1 / 12) { poseAt(st, t, t); drawHero(); bakeHero(); for (let i = 0; i < glow.length; i++) glow[i] = GLOW_SET[hero.mat[i]] && hero.out[i] !== 255 ? 1 : 0; frames.push({ t: +t.toFixed(3), px: b64(hero.out), glow: b64(glow), focus: [P.gx, P.gy], mx: P.mx, flip: P.flip }); }

}
// 确定性跳帧：暂停，清空特效，从状态开头按固定步长推进 t 秒并渲染（截图、审核用；skill 会自动走完蓄力 → 施放 → 收招）
const STATE_OF = { idle: IDLE, move: MOVE, attack: ATTACK, skill: CHARGE, hurt: HURT, death: DEATH };
function at(name, t) { const s = STATE_OF[name]; if (s == null) return null; paused = true; auto = false; fxReset(); dumHitT = 9; enter(s); const n = Math.round(t / DT); for (let i = 0; i < n; i++) update(); render(); return NAMES[state] + ' +' + stT.toFixed(2) + 's'; }
window.__pc = { play: (n) => play(STATE_OF[n]), at, resume: () => { paused = false; }, sheet: toggleSheet, audit, exportData, paletteCheck, get state() { return NAMES[state]; } };
poseAt(IDLE, 0, 0); requestAnimationFrame(frame);
})();
